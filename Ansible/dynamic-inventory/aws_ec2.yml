plugin: amazon.aws.aws_ec2

regions:
  - eu-north-1

filters:
  instance-state-name: running

compose:
  ansible_host: public_ip_address
  ansible_user: "'ubuntu'"
  ansible_ssh_private_key_file: "'~/.ssh/test1234.pem'" 

keyed_groups:
  - key: tags.Environment
    prefix: environment
  - key: tags.Role
    prefix: role
